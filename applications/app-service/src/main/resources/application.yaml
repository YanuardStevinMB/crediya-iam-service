server:
  port: 8081  # default para correr sin Docker (IntelliJ)

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: autenticacion
  devtools:
    add-properties: false
  liquibase:
    enabled: true
    driver-class-name: com.mysql.cj.jdbc.Driver
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # LIQUIBASE arma JDBC con adapters.r2dbc.* (mismo host/puerto/DB/user/pass que runtime)
    url: "jdbc:mysql://${adapters.r2dbc.host}:${adapters.r2dbc.port}/${adapters.r2dbc.database}?useUnicode=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC"
    user: "${adapters.r2dbc.username}"
    password: "${adapters.r2dbc.password}"

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs.path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: method
    tags-sorter: alpha

logging:
  file:
    name: logs/iam-app.log
  level:
    root: INFO
    com.crediya.iam: INFO
    io.r2dbc.mysql: WARN
    org.springframework.r2dbc: INFO

cors:
  allowed-origins: "http://localhost:4200,http://localhost:8081"

security:
  jwt:
    secret: "QnE1T2lXbVRhV3RzR2VOUXlHaFZ2d2dyU2p2a1R2TnM="
    expiration-sec: 3600
    issuer: "autenticacion-service"
    issuer-uri: ""

jwt:
  json-exp-roles: "/roles"
